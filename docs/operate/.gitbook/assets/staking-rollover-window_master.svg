<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1092" font-family="Instrument Sans, Helvetica, Arial, sans-serif">
  <rect width="1536" height="1092" fill="#0A0A0A"/>

  <!-- Title bar -->
  <rect x="20" y="20" width="1496" height="84" rx="26" fill="#F65B27"/>
  <path fill="#111111" stroke="#111111" stroke-width="1.5" stroke-linejoin="round" d="M52.000,62.000 C52.000,45.431 65.431,32.000 82.000,32.000 C98.569,32.000 112.000,45.431 112.000,62.000 C112.000,78.569 98.569,92.000 82.000,92.000 C65.431,92.000 52.000,78.569 52.000,62.000 Z"/>
  <g fill="#FFFFFF"><path fill-rule="evenodd" transform="translate(-3.68,-115.07) scale(0.714)" d="M127.15,241.02c-.15-.26-.13-.59.04-.86l7.33-10.88c.2-.31.22-.68.04-.99-.18-.33-.51-.51-.86-.51h-2.85c-.31,0-.61.15-.81.44l-8.56,12.75c-.22.33-.57.51-.97.51h-1.08c-.4,0-.75-.2-.97-.51l-8.52-12.77c-.18-.29-.5-.44-.81-.44h-2.85c-.35,0-.7.2-.86.53-.18.33-.13.7.04.99l7.33,10.9c.18.24.2.57.04.84-.15.29-.42.44-.72.44h-11.22c-.55,0-.97.44-.97.97v2.37c0,.55.44.97.97.97h38.18c.55,0,.97-.44.97-.97v-2.37c0-.51-.37-.9-.86-.97h-11.33c-.31,0-.59-.15-.72-.44ZM118.5,255.02l-8.56,12.75c-.18.29-.5.44-.81.44h-2.85c-.35,0-.68-.2-.86-.51-.18-.31-.15-.7.04-.99l7.31-10.88c.18-.26.2-.57.04-.86-.15-.26-.42-.44-.72-.44h-11.18c-.53,0-.97-.42-.97-.97v-2.37c0-.53.42-.97.97-.97h38.18c.53,0,.97.42.97.97v2.37c0,.53-.42.97-.97.97h-11.2c-.33,0-.59.15-.72.44-.15.29-.13.59.04.84l7.33,10.9c.18.29.22.66.04.99-.18.33-.5.53-.86.53h-2.85c-.33,0-.61-.15-.79-.42l-8.56-12.75c-.22-.33-.57-.51-.97-.51h-1.08c-.4,0-.75.2-.97.51l-.02-.04Z"/></g>
  <text x="132" y="75" font-size="36" font-weight="500" fill="#FFFFFF">The Rollover Window</text>

  <!-- Main card -->
  <rect x="20" y="128" width="1496" height="672" rx="24" fill="#161618"/>
  <text x="64" y="180" font-size="21" fill="#8E8E93" font-family="JetBrains Mono, Menlo, monospace" letter-spacing="2">THE LAST STRETCH OF A BOND: TWO GATES, ONE WINDOW</text>

  <!-- time markers -->
  <line x1="940" y1="238" x2="940" y2="648" stroke="#F9A03F" stroke-width="2.5" stroke-dasharray="6 6"/>
  <text x="940" y="228" font-size="20" fill="#F9A03F" text-anchor="middle" font-weight="600">Day 175</text>
  <line x1="1220" y1="238" x2="1220" y2="648" stroke="#F65B27" stroke-width="2.5"/>
  <text x="1220" y="228" font-size="20" fill="#F65B27" text-anchor="middle" font-weight="600">Day 182: bond ends</text>

  <!-- Lane 1 -->
  <text x="180" y="272" font-size="22" font-weight="600" fill="#FFFFFF">Gate 1, non-overlap: the new position's first reward cycle is at or after this bond's last</text>
  <rect x="180" y="286" width="1240" height="52" rx="12" fill="#F9A03F"/>
  <text x="800" y="320" font-size="19" fill="#111111" text-anchor="middle" font-family="JetBrains Mono, Menlo, monospace" letter-spacing="1">PASSES: BOND N+6, OR STX-ONLY FROM THE NEXT CYCLE, DOES NOT OVERLAP</text>

  <!-- Lane 2 -->
  <text x="180" y="392" font-size="22" font-weight="600" fill="#FFFFFF">Gate 2, rollover window: Bitcoin height has reached this bond's L1 unlock height</text>
  <rect x="180" y="406" width="760" height="52" rx="12" fill="#3A3A3C"/>
  <text x="560" y="440" font-size="19" fill="#8E8E93" text-anchor="middle" font-family="JetBrains Mono, Menlo, monospace" letter-spacing="1">FAILS BEFORE DAY 175</text>
  <rect x="940" y="406" width="480" height="52" rx="12" fill="#F9A03F"/>
  <text x="1180" y="440" font-size="19" fill="#111111" text-anchor="middle" font-family="JetBrains Mono, Menlo, monospace" letter-spacing="1">PASSES FROM DAY 175</text>

  <!-- Lane 3 -->
  <text x="180" y="512" font-size="22" font-weight="600" fill="#FFFFFF">Both gates together</text>
  <rect x="180" y="526" width="760" height="52" rx="12" fill="#3A3A3C"/>
  <text x="560" y="560" font-size="19" fill="#8E8E93" text-anchor="middle" font-family="JetBrains Mono, Menlo, monospace" letter-spacing="1">CLOSED</text>
  <rect x="940" y="526" width="480" height="52" rx="12" fill="#F65B27"/>
  <text x="1080" y="560" font-size="19" fill="#FFFFFF" text-anchor="middle" font-family="JetBrains Mono, Menlo, monospace" letter-spacing="1">OPEN</text>
  <text x="1322" y="560" font-size="19" fill="#FFFFFF" text-anchor="middle" font-family="JetBrains Mono, Menlo, monospace" letter-spacing="1">DOES NOT CLOSE</text>
  <rect x="1193" y="526" width="27" height="52" fill="#161618" stroke="#8E8E93" stroke-width="1.5" stroke-dasharray="3 4"/>
  <!-- highlight: Day 175..Day 182 stretch -->
  <rect x="934" y="518" width="265" height="68" rx="12" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="7 6"/>

  <!-- Bitcoin block scale -->
  <rect x="180" y="600" width="760" height="44" rx="10" fill="#1C1C1E" stroke="#3A3A3C" stroke-width="1.5"/>
  <text x="560" y="628" font-size="17" fill="#8E8E93" text-anchor="middle" font-family="JetBrains Mono, Menlo, monospace" letter-spacing="1">24,150 BITCOIN BLOCKS FROM BOND START</text>
  <rect x="940" y="600" width="253" height="44" rx="10" fill="#2C2C2E" stroke="#6E6E73" stroke-width="1.5"/>
  <text x="1066" y="628" font-size="17" fill="#FFFFFF" text-anchor="middle" font-family="JetBrains Mono, Menlo, monospace" letter-spacing="1">950 BITCOIN BLOCKS</text>
  <rect x="1193" y="600" width="27" height="44" fill="#161618" stroke="#8E8E93" stroke-width="1.5" stroke-dasharray="3 4"/>
  <line x1="1206" y1="580" x2="1206" y2="598" stroke="#8E8E93" stroke-width="1.5" stroke-dasharray="3 4"/>
  <rect x="1220" y="600" width="200" height="44" rx="10" fill="#1C1C1E" stroke="#3A3A3C" stroke-width="1.5"/>
  <text x="1320" y="628" font-size="17" fill="#8E8E93" text-anchor="middle" font-family="JetBrains Mono, Menlo, monospace" letter-spacing="1">NEXT BOND</text>

  <text x="180" y="686" font-size="22" fill="#C7C7CC">Both gates first pass together in the bond's final half reward cycle: after 24,150 of its 25,200 Bitcoin blocks.</text>
  <text x="180" y="718" font-size="20" fill="#C7C7CC">The last 100 Bitcoin blocks of every cycle are the prepare phase: stake and register-for-bond are both rejected.</text>
  <text x="180" y="748" font-size="20" fill="#FFFFFF">So a roll into bond n+6 has 950 usable Bitcoin blocks, from Day 175 to the prepare phase before Day 182.</text>
  <text x="180" y="778" font-size="20" fill="#C7C7CC">Bitcoin block heights are the trigger; day counts assume 6 months per bond and shift when blocks run fast or slow.</text>

  <!-- Route cards -->
  <rect x="20" y="820" width="740" height="234" rx="24" fill="#161618"/>
  <rect x="780" y="820" width="736" height="234" rx="24" fill="#161618"/>

  <text x="64" y="874" font-size="25" font-weight="600" fill="#FFFFFF">Bond to bond</text>
  <text x="64" y="906" font-size="19" fill="#F9A03F" font-family="JetBrains Mono, Menlo, monospace">via register-for-bond</text>
  <text font-size="22" fill="#C7C7CC">
    <tspan x="64" y="950">Only the net sBTC difference moves.</tspan>
    <tspan x="64" y="982">A same-size roll moves nothing, and the old</tspan>
    <tspan x="64" y="1014">bond's per-cycle shares stay in place.</tspan>
  </text>

  <text x="824" y="874" font-size="25" font-weight="600" fill="#FFFFFF">Bond to STX-only staking</text>
  <text x="824" y="906" font-size="19" fill="#F9A03F" font-family="JetBrains Mono, Menlo, monospace">via stake</text>
  <text font-size="22" fill="#C7C7CC">
    <tspan x="824" y="950">All custodied sBTC is refunded.</tspan>
    <tspan x="824" y="982">An L1 bond has nothing to refund: the BTC is on</tspan>
    <tspan x="824" y="1014">Bitcoin under your own timelock.</tspan>
  </text>
</svg>
