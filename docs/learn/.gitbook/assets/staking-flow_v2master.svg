<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1396" font-family="Instrument Sans, Helvetica, Arial, sans-serif">
  <rect width="1536" height="1396" fill="#0A0A0A"/>

  <!-- Title bar -->
  <rect x="20" y="20" width="1496" height="84" rx="26" fill="#F65B27"/>
  <path fill="#111111" stroke="#111111" stroke-width="1.5" stroke-linejoin="round" d="M52.000,62.000 C52.000,45.431 65.431,32.000 82.000,32.000 C98.569,32.000 112.000,45.431 112.000,62.000 C112.000,78.569 98.569,92.000 82.000,92.000 C65.431,92.000 52.000,78.569 52.000,62.000 Z"/>
  <g fill="#FFFFFF"><path fill-rule="evenodd" transform="translate(-3.68,-115.07) scale(0.714)" d="M127.15,241.02c-.15-.26-.13-.59.04-.86l7.33-10.88c.2-.31.22-.68.04-.99-.18-.33-.51-.51-.86-.51h-2.85c-.31,0-.61.15-.81.44l-8.56,12.75c-.22.33-.57.51-.97.51h-1.08c-.4,0-.75-.2-.97-.51l-8.52-12.77c-.18-.29-.5-.44-.81-.44h-2.85c-.35,0-.7.2-.86.53-.18.33-.13.7.04.99l7.33,10.9c.18.24.2.57.04.84-.15.29-.42.44-.72.44h-11.22c-.55,0-.97.44-.97.97v2.37c0,.55.44.97.97.97h38.18c.55,0,.97-.44.97-.97v-2.37c0-.51-.37-.9-.86-.97h-11.33c-.31,0-.59-.15-.72-.44ZM118.5,255.02l-8.56,12.75c-.18.29-.5.44-.81.44h-2.85c-.35,0-.68-.2-.86-.51-.18-.31-.15-.7.04-.99l7.31-10.88c.18-.26.2-.57.04-.86-.15-.26-.42-.44-.72-.44h-11.18c-.53,0-.97-.42-.97-.97v-2.37c0-.53.42-.97.97-.97h38.18c.53,0,.97.42.97.97v2.37c0,.53-.42.97-.97.97h-11.2c-.33,0-.59.15-.72.44-.15.29-.13.59.04.84l7.33,10.9c.18.29.22.66.04.99-.18.33-.5.53-.86.53h-2.85c-.33,0-.61-.15-.79-.42l-8.56-12.75c-.22-.33-.57-.51-.97-.51h-1.08c-.4,0-.75.2-.97.51l-.02-.04Z"/></g>
  <text x="132" y="75" font-size="36" font-weight="500" fill="#FFFFFF">Staking Flow: Two Ways In</text>

  <!-- Column cards -->
  <rect x="24" y="132" width="730" height="1120" rx="24" fill="#161618"/>
  <rect x="782" y="132" width="730" height="1120" rx="24" fill="#161618"/>

  <!-- Column headers -->
  <rect x="24" y="132" width="730" height="104" rx="24" fill="#F65B27"/>
  <rect x="24" y="212" width="730" height="24" fill="#161618"/>
  <text x="389" y="178" font-size="27" font-weight="600" fill="#FFFFFF" text-anchor="middle">Bitcoin Staking: Protocol Bond</text>
  <text x="389" y="208" font-size="18" fill="#FFD9C7" text-anchor="middle" font-family="JetBrains Mono, Menlo, monospace">allowlisted capacity - target APY</text>

  <rect x="782" y="132" width="730" height="104" rx="24" fill="#3A3A3C"/>
  <rect x="782" y="212" width="730" height="24" fill="#161618"/>
  <text x="1147" y="178" font-size="27" font-weight="600" fill="#FFFFFF" text-anchor="middle">STX-Only Staking</text>
  <text x="1147" y="208" font-size="18" fill="#C7C7CC" text-anchor="middle" font-family="JetBrains Mono, Menlo, monospace">uncapped - residual yield</text>

  <!-- ===== Column B: protocol bond ===== -->
  <g>
    <circle cx="80" cy="296" r="22" fill="#F65B27"/>
    <text x="80" y="304" font-size="24" font-weight="600" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="120" y="290" font-size="22" font-weight="600" fill="#FFFFFF">Get allowlisted</text>
    <text x="120" y="322" font-size="22" fill="#C7C7CC">The Endowment sets your maximum sats for</text>
    <text x="120" y="352" font-size="22" fill="#C7C7CC">the bond period. There is no auction in PoX-5.</text>

    <circle cx="80" cy="428" r="22" fill="#F65B27"/>
    <text x="80" y="436" font-size="24" font-weight="600" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="120" y="422" font-size="22" font-weight="600" fill="#FFFFFF">Lock the Bitcoin leg</text>
    <text x="120" y="454" font-size="22" fill="#C7C7CC">register-for-bond with the paired STX, before the bond starts.</text>

    <!-- split cells: lock step -->
    <rect x="64" y="478" width="322" height="196" rx="14" fill="#3A3A3C" opacity="0.6"/>
    <text x="96" y="516" font-size="17" fill="#F9A03F" font-family="JetBrains Mono, Menlo, monospace" letter-spacing="2">NATIVE BTC</text>
    <text x="96" y="548" font-size="20" fill="#C7C7CC">CLTV timelock on L1 under</text>
    <text x="96" y="576" font-size="20" fill="#C7C7CC">your own keys, expiring no</text>
    <text x="96" y="604" font-size="20" fill="#C7C7CC">earlier than 1,050 Bitcoin</text>
    <text x="96" y="632" font-size="20" fill="#C7C7CC">blocks before bond end.</text>

    <rect x="402" y="478" width="322" height="196" rx="14" fill="#3A3A3C" opacity="0.6"/>
    <text x="434" y="516" font-size="17" fill="#F65B27" font-family="JetBrains Mono, Menlo, monospace" letter-spacing="2">SBTC</text>
    <text x="434" y="548" font-size="20" fill="#C7C7CC">Locked in pox-5 custody</text>
    <text x="434" y="576" font-size="20" fill="#C7C7CC">for the term. No Bitcoin</text>
    <text x="434" y="604" font-size="20" fill="#C7C7CC">transaction needed.</text>

    <circle cx="80" cy="742" r="22" fill="#F65B27"/>
    <text x="80" y="750" font-size="24" font-weight="600" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="120" y="736" font-size="22" font-weight="600" fill="#FFFFFF">Bond runs 12 reward cycles</text>
    <text x="120" y="768" font-size="22" fill="#C7C7CC">Target APY on the sats, paid first in the waterfall:</text>
    <text x="120" y="798" font-size="22" fill="#C7C7CC">24 distributions, one per 1,050 Bitcoin blocks.</text>
    <text x="120" y="828" font-size="22" fill="#C7C7CC">The paired STX earns no yield.</text>

    <circle cx="80" cy="900" r="22" fill="#F65B27"/>
    <text x="80" y="908" font-size="24" font-weight="600" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="120" y="894" font-size="22" font-weight="600" fill="#FFFFFF">Get paid</text>
    <text x="120" y="926" font-size="22" fill="#C7C7CC">Your manager claims and distributes, as BTC on L1 or sBTC.</text>

    <circle cx="80" cy="988" r="22" fill="#F65B27"/>
    <text x="80" y="996" font-size="24" font-weight="600" fill="#FFFFFF" text-anchor="middle">5</text>
    <text x="120" y="982" font-size="22" font-weight="600" fill="#FFFFFF">End or exit</text>
    <text x="120" y="1014" font-size="22" fill="#C7C7CC">STX unlocks at bond end. Roll into bond n+6 from Day 175.</text>

    <!-- split cells: exit step -->
    <rect x="64" y="1038" width="322" height="180" rx="14" fill="#3A3A3C" opacity="0.6"/>
    <text x="96" y="1076" font-size="17" fill="#F9A03F" font-family="JetBrains Mono, Menlo, monospace" letter-spacing="2">NATIVE BTC</text>
    <text x="96" y="1108" font-size="20" fill="#C7C7CC">Timelock expires: re-lock</text>
    <text x="96" y="1136" font-size="20" fill="#C7C7CC">or spend. Early exit forfeits</text>
    <text x="96" y="1164" font-size="20" fill="#C7C7CC">the remaining yield.</text>

    <rect x="402" y="1038" width="322" height="180" rx="14" fill="#3A3A3C" opacity="0.6"/>
    <text x="434" y="1076" font-size="17" fill="#F65B27" font-family="JetBrains Mono, Menlo, monospace" letter-spacing="2">SBTC</text>
    <text x="434" y="1108" font-size="20" fill="#C7C7CC">Returned at term, or</text>
    <text x="434" y="1136" font-size="20" fill="#C7C7CC">unstake-sbtc any time,</text>
    <text x="434" y="1164" font-size="20" fill="#C7C7CC">forfeiting future yield.</text>
  </g>

  <!-- ===== Column A: STX-only ===== -->
  <g>
    <circle cx="838" cy="296" r="22" fill="#3A3A3C"/>
    <text x="838" y="304" font-size="24" font-weight="600" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="878" y="290" font-size="22" font-weight="600" fill="#FFFFFF">Choose a signer-manager</text>
    <text x="878" y="322" font-size="22" fill="#C7C7CC">Fee and admin set are readable on-chain</text>
    <text x="878" y="352" font-size="22" fill="#C7C7CC">before you commit.</text>

    <circle cx="838" cy="452" r="22" fill="#3A3A3C"/>
    <text x="838" y="460" font-size="24" font-weight="600" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="878" y="446" font-size="22" font-weight="600" fill="#FFFFFF">stake</text>
    <text x="878" y="478" font-size="22" fill="#C7C7CC">Amount plus 1 to 96 reward cycles. STX locks in</text>
    <text x="878" y="508" font-size="22" fill="#C7C7CC">your own account. No minimum for you: the</text>
    <text x="878" y="538" font-size="22" fill="#C7C7CC">50,000 STX threshold is the manager's.</text>

    <circle cx="838" cy="644" r="22" fill="#3A3A3C"/>
    <text x="838" y="652" font-size="24" font-weight="600" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="878" y="638" font-size="22" font-weight="600" fill="#FFFFFF">Earn per cycle</text>
    <text x="878" y="670" font-size="22" fill="#C7C7CC">Miner BTC left after bond obligations: 85% to</text>
    <text x="878" y="700" font-size="22" fill="#C7C7CC">STX-only stakers, 15% to the reserve. Credited</text>
    <text x="878" y="730" font-size="22" fill="#C7C7CC">every 1,050 Bitcoin blocks.</text>

    <circle cx="838" cy="838" r="22" fill="#3A3A3C"/>
    <text x="838" y="846" font-size="24" font-weight="600" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="878" y="832" font-size="22" font-weight="600" fill="#FFFFFF">Get paid</text>
    <text x="878" y="864" font-size="22" fill="#C7C7CC">Your manager claims any time and distributes</text>
    <text x="878" y="894" font-size="22" fill="#C7C7CC">sBTC, or native BTC if you elected that.</text>

    <circle cx="838" cy="1000" r="22" fill="#3A3A3C"/>
    <text x="838" y="1008" font-size="24" font-weight="600" fill="#FFFFFF" text-anchor="middle">5</text>
    <text x="878" y="994" font-size="22" font-weight="600" fill="#FFFFFF">unstake any time</text>
    <text x="878" y="1026" font-size="22" fill="#C7C7CC">Outside the prepare phase. STX unlocks at the</text>
    <text x="878" y="1056" font-size="22" fill="#C7C7CC">next cycle start. Or roll into a bond as one opens.</text>
  </g>

  <!-- Footer band -->
  <rect x="24" y="1276" width="1488" height="92" rx="24" fill="#161618"/>
  <circle cx="86" cy="1322" r="24" fill="#F65B27"/>
  <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M76 1322 L84 1330 L98 1312"/>
  </g>
  <text x="132" y="1314" font-size="22" fill="#FFFFFF" font-weight="600">Two mutually exclusive paths: one position per Stacks principal at a time, and both route through a signer-manager.</text>
  <text x="132" y="1346" font-size="20" fill="#8E8E93">The STX always locks in your own account. Rewards credit every 1,050 Bitcoin blocks; managers claim on their own schedule.</text>
</svg>
