<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1180" font-family="Instrument Sans, Helvetica, Arial, sans-serif">
  <rect width="1536" height="1180" fill="#0A0A0A"/>

  <!-- Title bar -->
  <rect x="20" y="20" width="1496" height="84" rx="26" fill="#F65B27"/>
  <path fill="#111111" stroke="#111111" stroke-width="1.5" stroke-linejoin="round" d="M52.000,62.000 C52.000,45.431 65.431,32.000 82.000,32.000 C98.569,32.000 112.000,45.431 112.000,62.000 C112.000,78.569 98.569,92.000 82.000,92.000 C65.431,92.000 52.000,78.569 52.000,62.000 Z"/>
  <g fill="#FFFFFF"><path fill-rule="evenodd" transform="translate(-3.68,-115.07) scale(0.714)" d="M127.15,241.02c-.15-.26-.13-.59.04-.86l7.33-10.88c.2-.31.22-.68.04-.99-.18-.33-.51-.51-.86-.51h-2.85c-.31,0-.61.15-.81.44l-8.56,12.75c-.22.33-.57.51-.97.51h-1.08c-.4,0-.75-.2-.97-.51l-8.52-12.77c-.18-.29-.5-.44-.81-.44h-2.85c-.35,0-.7.2-.86.53-.18.33-.13.7.04.99l7.33,10.9c.18.24.2.57.04.84-.15.29-.42.44-.72.44h-11.22c-.55,0-.97.44-.97.97v2.37c0,.55.44.97.97.97h38.18c.55,0,.97-.44.97-.97v-2.37c0-.51-.37-.9-.86-.97h-11.33c-.31,0-.59-.15-.72-.44ZM118.5,255.02l-8.56,12.75c-.18.29-.5.44-.81.44h-2.85c-.35,0-.68-.2-.86-.51-.18-.31-.15-.7.04-.99l7.31-10.88c.18-.26.2-.57.04-.86-.15-.26-.42-.44-.72-.44h-11.18c-.53,0-.97-.42-.97-.97v-2.37c0-.53.42-.97.97-.97h38.18c.53,0,.97.42.97.97v2.37c0,.53-.42.97-.97.97h-11.2c-.33,0-.59.15-.72.44-.15.29-.13.59.04.84l7.33,10.9c.18.29.22.66.04.99-.18.33-.5.53-.86.53h-2.85c-.33,0-.61-.15-.79-.42l-8.56-12.75c-.22-.33-.57-.51-.97-.51h-1.08c-.4,0-.75.2-.97.51l-.02-.04Z"/></g>
  <text x="132" y="75" font-size="36" font-weight="500" fill="#FFFFFF">The Reward Waterfall</text>

  <!-- Pool bar -->
  <rect x="20" y="128" width="1496" height="72" rx="18" fill="#F65B27"/>
  <text x="768" y="172" font-size="26" font-weight="500" fill="#FFFFFF" text-anchor="middle">sBTC rewards arrive in pox-5, once per 1,050-Bitcoin-block distribution</text>

  <!-- down arrow -->
  <line x1="768" y1="204" x2="768" y2="240" stroke="#F65B27" stroke-width="3" stroke-dasharray="5 7" stroke-linecap="round"/>
  <path d="M758 232 L768 242 L778 232" stroke="#F65B27" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Tranche 1 card -->
  <rect x="20" y="250" width="1496" height="474" rx="24" fill="#161618"/>
  <text x="64" y="304" font-size="27" font-weight="600" fill="#FFFFFF">Active Protocol Bonds Tranche</text>
  <text x="64" y="336" font-size="19" fill="#8E8E93" font-family="JetBrains Mono, Menlo, monospace" letter-spacing="2">PAID FIRST, IN FULL, BEFORE ANYTHING ELSE IS ALLOCATED</text>
  <text x="64" y="378" font-size="22" fill="#C7C7CC">Bonds are paid in order: highest stx-value-ratio first (uSTX per 100 sats), lowest bond index breaks ties.</text>
  <text x="64" y="412" font-size="20" fill="#F9A03F" font-family="JetBrains Mono, Menlo, monospace">each bond's target per distribution: (total-sats * target-rate / 10000) / 50</text>
  <text x="64" y="450" font-size="19" fill="#8E8E93" font-family="JetBrains Mono, Menlo, monospace" letter-spacing="2">EXAMPLE: ONE DISTRIBUTION WHERE REWARDS RUN SHORT</text>

  <!-- Bond chips: full, full, partial, empty, empty -->
  <!-- chip 1 -->
  <rect x="64" y="470" width="250" height="128" rx="14" fill="none" stroke="#6E6E73" stroke-width="2"/>
  <rect x="67" y="473" width="244" height="122" rx="12" fill="#F65B27"/>
  <text x="189" y="516" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="middle">paid 1st</text>
  <text x="189" y="546" font-size="19" fill="#FFD9C7" text-anchor="middle">highest ratio</text>
  <text x="189" y="630" font-size="20" fill="#C7C7CC" text-anchor="middle">full target</text>
  <!-- chip 2 -->
  <rect x="350" y="470" width="250" height="128" rx="14" fill="none" stroke="#6E6E73" stroke-width="2"/>
  <rect x="353" y="473" width="244" height="122" rx="12" fill="#F65B27"/>
  <text x="475" y="516" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="middle">paid 2nd</text>
  <text x="475" y="630" font-size="20" fill="#C7C7CC" text-anchor="middle">full target</text>
  <!-- chip 3: partial -->
  <rect x="636" y="470" width="250" height="128" rx="14" fill="none" stroke="#6E6E73" stroke-width="2"/>
  <rect x="639" y="473" width="244" height="122" rx="12" fill="#F65B27"/>
  <text x="761" y="516" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="middle">paid 3rd</text>
  <text x="761" y="630" font-size="20" fill="#C7C7CC" text-anchor="middle">full target</text>
  <!-- chip 4: empty -->
  <rect x="922" y="470" width="250" height="128" rx="14" fill="none" stroke="#6E6E73" stroke-width="2"/>
  <rect x="925" y="542" width="244" height="53" rx="10" fill="#F65B27"/>
  <text x="1047" y="516" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="middle">paid 4th</text>
  <text x="1047" y="630" font-size="20" fill="#F9A03F" text-anchor="middle">takes what remains</text>
  <!-- chip 5: empty -->
  <rect x="1208" y="470" width="250" height="128" rx="14" fill="none" stroke="#3A3A3C" stroke-width="2"/>
  <text x="1333" y="516" font-size="22" font-weight="600" fill="#6E6E73" text-anchor="middle">5th</text>
  <text x="1333" y="630" font-size="20" fill="#8E8E93" text-anchor="middle">nothing</text>

  <text x="768" y="690" font-size="24" font-weight="600" fill="#FFFFFF" text-anchor="middle">Shortfall is all or nothing per bond, not proportional.</text>

  <!-- cycle excess arrow -->
  <line x1="768" y1="728" x2="768" y2="780" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="5 7" stroke-linecap="round"/>
  <path d="M758 772 L768 782 L778 772" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="800" y="762" font-size="24" font-weight="600" fill="#FFFFFF">cycle excess: what remains after every bond is paid</text>

  <!-- fan arrows -->
  <path d="M768 790 L460 828" stroke="#8E8E93" stroke-width="3" stroke-dasharray="5 7" fill="none" stroke-linecap="round"/>
  <path d="M474 820 L460 828 L472 838" stroke="#8E8E93" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M768 790 L1218 828" stroke="#8E8E93" stroke-width="3" stroke-dasharray="5 7" fill="none" stroke-linecap="round"/>
  <path d="M1204 838 L1218 828 L1204 820" stroke="#8E8E93" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Tranche 2 card -->
  <rect x="20" y="840" width="880" height="250" rx="24" fill="#161618"/>
  <text x="64" y="894" font-size="27" font-weight="600" fill="#FFFFFF">STX-only stakers Tranche</text>
  <text x="64" y="964" font-size="52" font-weight="600" fill="#F65B27">85%</text>
  <text x="64" y="1006" font-size="22" fill="#C7C7CC">of the cycle excess, pro rata by shares staked.</text>

  <!-- Tranche 3 card -->
  <rect x="920" y="840" width="596" height="250" rx="24" fill="#161618"/>
  <text x="964" y="894" font-size="27" font-weight="600" fill="#FFFFFF">Reserve Fund Tranche</text>
  <text x="964" y="964" font-size="52" font-weight="600" fill="#F9A03F">15%</text>
  <text x="964" y="1006" font-size="22" fill="#C7C7CC">of the cycle excess (RESERVE_RATIO u1500 of 10,000).</text>
  <text x="964" y="1040" font-size="22" fill="#C7C7CC">The reserve only grows: no contract function</text>
  <text x="964" y="1070" font-size="22" fill="#C7C7CC">draws it down.</text>

  <!-- conditional branch -->
  <path d="M460 1090 V1130 H1218 V1100" stroke="#F9A03F" stroke-width="3" stroke-dasharray="5 7" fill="none" stroke-linecap="round"/>
  <path d="M1208 1110 L1218 1100 L1228 1110" stroke="#F9A03F" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="839" y="1162" font-size="20" fill="#F9A03F" text-anchor="middle" font-family="JetBrains Mono, Menlo, monospace" letter-spacing="1">IF NO STX-ONLY STAKERS THIS CYCLE, THE 85% FOLDS INTO THE RESERVE: IT TAKES 100% OF THE CYCLE EXCESS</text>
</svg>
