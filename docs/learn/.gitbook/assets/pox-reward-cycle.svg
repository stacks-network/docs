<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 700" font-family="Instrument Sans, Helvetica, Arial, sans-serif">
  <rect width="1536" height="700" fill="#0A0A0A"/>

  <!-- Title pill -->
  <rect x="20" y="20" width="1496" height="84" rx="26" fill="#F65B27"/>
  <path fill="#111111" stroke="#111111" stroke-width="1.5" stroke-linejoin="round" d="M52.000,62.000 C52.000,45.431 65.431,32.000 82.000,32.000 C98.569,32.000 112.000,45.431 112.000,62.000 C112.000,78.569 98.569,92.000 82.000,92.000 C65.431,92.000 52.000,78.569 52.000,62.000 Z"/>
  <g fill="#FFFFFF"><path fill-rule="evenodd" transform="translate(-3.68,-115.07) scale(0.714)" d="M127.15,241.02c-.15-.26-.13-.59.04-.86l7.33-10.88c.2-.31.22-.68.04-.99-.18-.33-.51-.51-.86-.51h-2.85c-.31,0-.61.15-.81.44l-8.56,12.75c-.22.33-.57.51-.97.51h-1.08c-.4,0-.75-.2-.97-.51l-8.52-12.77c-.18-.29-.5-.44-.81-.44h-2.85c-.35,0-.7.2-.86.53-.18.33-.13.7.04.99l7.33,10.9c.18.24.2.57.04.84-.15.29-.42.44-.72.44h-11.22c-.55,0-.97.44-.97.97v2.37c0,.55.44.97.97.97h38.18c.55,0,.97-.44.97-.97v-2.37c0-.51-.37-.9-.86-.97h-11.33c-.31,0-.59-.15-.72-.44ZM118.5,255.02l-8.56,12.75c-.18.29-.5.44-.81.44h-2.85c-.35,0-.68-.2-.86-.51-.18-.31-.15-.7.04-.99l7.31-10.88c.18-.26.2-.57.04-.86-.15-.26-.42-.44-.72-.44h-11.18c-.53,0-.97-.42-.97-.97v-2.37c0-.53.42-.97.97-.97h38.18c.53,0,.97.42.97.97v2.37c0,.53-.42.97-.97.97h-11.2c-.33,0-.59.15-.72.44-.15.29-.13.59.04.84l7.33,10.9c.18.29.22.66.04.99-.18.33-.5.53-.86.53h-2.85c-.33,0-.61-.15-.79-.42l-8.56-12.75c-.22-.33-.57-.51-.97-.51h-1.08c-.4,0-.75.2-.97.51l-.02-.04Z"/></g>
  <text x="132" y="75" font-size="36" font-weight="500" fill="#FFFFFF">The Reward Cycle</text>

  <!-- Main card -->
  <rect x="20" y="128" width="1496" height="560" rx="24" fill="#161618" stroke="#2C2C2E" stroke-width="1.5"/>

  <!-- cycle bracket -->
  <text x="768" y="196" font-size="21" fill="#8E8E93" text-anchor="middle" font-family="JetBrains Mono, Menlo, monospace" letter-spacing="2">ONE REWARD CYCLE: 2,100 BITCOIN BLOCKS</text>
  <g stroke="#8E8E93" stroke-width="2" stroke-dasharray="4 5" fill="none">
    <path d="M138 232 L138 212 L1398 212 L1398 232"/>
  </g>

  <!-- phase bars: reward 2,000 (x138..1338), prepare 100 (x1338..1398) -->
  <rect x="138" y="256" width="1194" height="96" rx="18" fill="#F65B27"/>
  <text x="580" y="302" font-size="27" font-weight="600" fill="#FFFFFF" text-anchor="middle">Reward phase</text>
  <text x="580" y="334" font-size="20" fill="#FFD9C7" text-anchor="middle">2,000 Bitcoin blocks</text>
  <rect x="1338" y="256" width="60" height="96" rx="12" fill="#6E6E73"/>

  <!-- prepare phase label via leader -->
  <line x1="1368" y1="256" x2="1368" y2="232" stroke="#6E6E73" stroke-width="2"/>
  <text x="1368" y="248" font-size="1" fill="none"> </text>
  <text x="1404" y="180" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="end">Prepare phase</text>
  <line x1="1368" y1="250" x2="1368" y2="200" stroke="#6E6E73" stroke-width="2" stroke-dasharray="3 4"/>
  <text x="1404" y="204" font-size="18" fill="#C7C7CC" text-anchor="end">100 Bitcoin blocks</text>

  <!-- next cycle stub -->
  <rect x="1406" y="256" width="90" height="96" rx="18" fill="#2C2C2E"/>
  <text x="1451" y="310" font-size="18" fill="#8E8E93" text-anchor="middle">next cycle</text>

  <!-- anchor block marker (inside prepare phase, near its start) -->
  <rect x="1338" y="270" width="18" height="68" rx="4" fill="#FFFFFF" transform="rotate(0)"/>
  <line x1="1347" y1="352" x2="1347" y2="420" stroke="#FFFFFF" stroke-width="2.5"/>
  <text x="1347" y="448" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="end">Anchor block</text>
  <text font-size="18" fill="#C7C7CC" text-anchor="end">
    <tspan x="1440" y="478">the first Stacks block confirmed in the prepare phase.</tspan>
    <tspan x="1440" y="504">The next cycle's signer set is determined</tspan>
    <tspan x="1440" y="530">from the chain state at that block.</tspan>
  </text>

  <!-- distribution markers at 1,050 (x=768) and 2,100 (x=1398) -->
  <line x1="768" y1="256" x2="768" y2="380" stroke="#F9A03F" stroke-width="2.5" stroke-dasharray="6 6"/>
  <circle cx="768" cy="396" r="17" fill="#F9A03F"/>
  <text x="768" y="403" font-size="18" font-weight="600" fill="#111111" text-anchor="middle">1</text>
  <line x1="1398" y1="356" x2="1398" y2="380" stroke="#F9A03F" stroke-width="2.5" stroke-dasharray="6 6"/>
  <circle cx="1398" cy="396" r="17" fill="#F9A03F"/>
  <text x="1398" y="403" font-size="18" font-weight="600" fill="#111111" text-anchor="middle">2</text>
  <text x="768" y="448" font-size="20" font-weight="600" fill="#F9A03F" text-anchor="middle">Distributions</text>
  <text font-size="18" fill="#C7C7CC" text-anchor="middle">
    <tspan x="768" y="478">calculated every 1,050 Bitcoin blocks:</tspan>
    <tspan x="768" y="504">two per reward cycle</tspan>
  </text>

  <!-- block scale -->
  <g font-size="17" fill="#6E6E73" text-anchor="middle" font-family="JetBrains Mono, Menlo, monospace">
    <text x="138" y="570">0</text>
    <text x="768" y="570">1,050</text>
    <text x="1338" y="570">2,000</text>
    <text x="1398" y="596">2,099</text>
  </g>
  <line x1="138" y1="548" x2="1398" y2="548" stroke="#2C2C2E" stroke-width="2"/>
  <g stroke="#2C2C2E" stroke-width="2">
    <line x1="138" y1="542" x2="138" y2="554"/>
    <line x1="768" y1="542" x2="768" y2="554"/>
    <line x1="1338" y1="542" x2="1338" y2="554"/>
    <line x1="1398" y1="542" x2="1398" y2="554"/>
  </g>

  <text x="64" y="648" font-size="20" fill="#C7C7CC">The cycle repeats without pause: the block after the prepare phase is block 0 of the next cycle.</text>
</svg>
