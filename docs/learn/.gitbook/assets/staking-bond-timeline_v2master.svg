<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1330" font-family="Instrument Sans, Helvetica, Arial, sans-serif">
  <rect width="1536" height="1330" fill="#0A0A0A"/>

  <!-- Title bar -->
  <rect x="20" y="20" width="1496" height="84" rx="26" fill="#F65B27"/>
  <path fill="#111111" stroke="#111111" stroke-width="1.5" stroke-linejoin="round" d="M52.000,62.000 C52.000,45.431 65.431,32.000 82.000,32.000 C98.569,32.000 112.000,45.431 112.000,62.000 C112.000,78.569 98.569,92.000 82.000,92.000 C65.431,92.000 52.000,78.569 52.000,62.000 Z"/>
  <g fill="#FFFFFF"><path fill-rule="evenodd" transform="translate(-3.68,-115.07) scale(0.714)" d="M127.15,241.02c-.15-.26-.13-.59.04-.86l7.33-10.88c.2-.31.22-.68.04-.99-.18-.33-.51-.51-.86-.51h-2.85c-.31,0-.61.15-.81.44l-8.56,12.75c-.22.33-.57.51-.97.51h-1.08c-.4,0-.75-.2-.97-.51l-8.52-12.77c-.18-.29-.5-.44-.81-.44h-2.85c-.35,0-.7.2-.86.53-.18.33-.13.7.04.99l7.33,10.9c.18.24.2.57.04.84-.15.29-.42.44-.72.44h-11.22c-.55,0-.97.44-.97.97v2.37c0,.55.44.97.97.97h38.18c.55,0,.97-.44.97-.97v-2.37c0-.51-.37-.9-.86-.97h-11.33c-.31,0-.59-.15-.72-.44ZM118.5,255.02l-8.56,12.75c-.18.29-.5.44-.81.44h-2.85c-.35,0-.68-.2-.86-.51-.18-.31-.15-.7.04-.99l7.31-10.88c.18-.26.2-.57.04-.86-.15-.26-.42-.44-.72-.44h-11.18c-.53,0-.97-.42-.97-.97v-2.37c0-.53.42-.97.97-.97h38.18c.53,0,.97.42.97.97v2.37c0,.53-.42.97-.97.97h-11.2c-.33,0-.59.15-.72.44-.15.29-.13.59.04.84l7.33,10.9c.18.29.22.66.04.99-.18.33-.5.53-.86.53h-2.85c-.33,0-.61-.15-.79-.42l-8.56-12.75c-.22-.33-.57-.51-.97-.51h-1.08c-.4,0-.75.2-.97.51l-.02-.04Z"/></g>
  <text x="132" y="75" font-size="36" font-weight="500" fill="#FFFFFF">Protocol Bond Timeline</text>

  <!-- ============ PANEL 1: staggered bond periods ============ -->
  <text x="24" y="164" font-size="27" font-weight="600" fill="#FFFFFF">Six bonds run at once, staggered</text>
  <text x="24" y="196" font-size="21" fill="#8E8E93" font-family="JetBrains Mono, Menlo, monospace">new bond every 2 reward cycles (4,200 Bitcoin blocks), each runs 12 reward cycles (25,200 Bitcoin blocks)</text>

  <g font-size="17" fill="#6E6E73" text-anchor="middle" font-family="JetBrains Mono, Menlo, monospace">
    <text x="150" y="232">0</text>
    <text x="262" y="232">2</text>
    <text x="374" y="232">4</text>
    <text x="486" y="232">6</text>
    <text x="598" y="232">8</text>
    <text x="710" y="232">10</text>
    <text x="822" y="232">12</text>
    <text x="934" y="232">14</text>
    <text x="1046" y="232">16</text>
    <text x="1158" y="232">18</text>
    <text x="1270" y="232">20</text>
    <text x="1382" y="232">22</text>
    <text x="1494" y="232">24</text>
  </g>
  <text x="88" y="232" font-size="17" fill="#6E6E73" text-anchor="start" font-family="JetBrains Mono, Menlo, monospace">cycle</text>
  <line x1="150" y1="244" x2="1494" y2="244" stroke="#2C2C2E" stroke-width="2"/>
  <g stroke="#1C1C1E" stroke-width="1.5">
    <line x1="150" y1="244" x2="150" y2="700"/><line x1="262" y1="244" x2="262" y2="700"/>
    <line x1="374" y1="244" x2="374" y2="700"/><line x1="486" y1="244" x2="486" y2="700"/>
    <line x1="598" y1="244" x2="598" y2="700"/><line x1="710" y1="244" x2="710" y2="700"/>
    <line x1="822" y1="244" x2="822" y2="700"/><line x1="934" y1="244" x2="934" y2="700"/>
    <line x1="1046" y1="244" x2="1046" y2="700"/><line x1="1158" y1="244" x2="1158" y2="700"/>
    <line x1="1270" y1="244" x2="1270" y2="700"/><line x1="1382" y1="244" x2="1382" y2="700"/>
    <line x1="1494" y1="244" x2="1494" y2="700"/>
  </g>

  <g font-size="19" font-weight="600" fill="#FFFFFF">
    <rect x="150" y="260" width="672" height="44" rx="10" fill="#F65B27"/>
    <text x="166" y="289">bond n</text>
    <rect x="262" y="318" width="672" height="44" rx="10" fill="#3A3A3C"/>
    <text x="278" y="347" fill="#C7C7CC">bond n+1</text>
    <rect x="374" y="376" width="672" height="44" rx="10" fill="#3A3A3C"/>
    <text x="390" y="405" fill="#C7C7CC">bond n+2</text>
    <rect x="486" y="434" width="672" height="44" rx="10" fill="#3A3A3C"/>
    <text x="502" y="463" fill="#C7C7CC">bond n+3</text>
    <rect x="598" y="492" width="672" height="44" rx="10" fill="#3A3A3C"/>
    <text x="614" y="521" fill="#C7C7CC">bond n+4</text>
    <rect x="710" y="550" width="672" height="44" rx="10" fill="#3A3A3C"/>
    <text x="726" y="579" fill="#C7C7CC">bond n+5</text>
    <rect x="822" y="608" width="672" height="44" rx="10" fill="#E8E8ED"/>
    <text x="838" y="637" fill="#111111">bond n+6</text>
  </g>

  <line x1="822" y1="252" x2="822" y2="668" stroke="#F65B27" stroke-width="2.5" stroke-dasharray="6 6"/>
  <path d="M826 282 C 880 282, 880 616, 832 626" stroke="#F65B27" stroke-width="3" fill="none"/>
  <path d="M842 630 L828 632 L836 618 Z" fill="#F65B27"/>
  <text x="850" y="676" font-size="20" fill="#F65B27" font-weight="600">bond n ends at the block where bond n+6 starts: direct roll-over</text>

  <line x1="766" y1="252" x2="766" y2="600" stroke="#8E8E93" stroke-width="2" stroke-dasharray="3 6"/>
  <text x="758" y="700" font-size="19" fill="#8E8E93" text-anchor="end">any moment: 6 bonds live</text>

  <!-- ============ PANEL 2: one bond, two legs ============ -->
  <text x="24" y="768" font-size="27" font-weight="600" fill="#FFFFFF">One bond, two legs</text>

  <!-- Enrollment box spanning both legs -->
  <rect x="150" y="826" width="260" height="130" rx="14" fill="#3A3A3C"/>
  <text x="280" y="868" font-size="21" font-weight="600" fill="#FFFFFF" text-anchor="middle">Enrollment</text>
  <text x="280" y="898" font-size="18" fill="#C7C7CC" text-anchor="middle">registration lands 100 Bitcoin</text>
  <text x="280" y="924" font-size="18" fill="#C7C7CC" text-anchor="middle">blocks before Day 0</text>

  <!-- D0 marker -->
  <line x1="438" y1="800" x2="438" y2="968" stroke="#FFFFFF" stroke-width="2.5"/>
  <text x="438" y="790" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="600">Day 0</text>

  <!-- BTC leg: ends at D172 (x = 1290 - 35.5 = 1254.5) -->
  <rect x="438" y="826" width="702" height="56" rx="12" fill="#F9A03F"/>
  <text x="789" y="862" font-size="21" font-weight="600" fill="#111111" text-anchor="middle">BTC leg: L1 timelock under your own keys</text>

  <!-- STX leg: ends at D182 (x = 1290) -->
  <rect x="438" y="900" width="852" height="56" rx="12" fill="#F65B27"/>
  <text x="864" y="936" font-size="21" font-weight="600" fill="#FFFFFF" text-anchor="middle">STX leg: locked on Stacks for the full term</text>
  <path d="M1262,900 H1278 A12,12 0 0 1 1290,912 V944 A12,12 0 0 1 1278,956 H1262 Z" fill="#B23E17"/>

  <!-- D172 marker -->
  <line x1="1140" y1="800" x2="1140" y2="968" stroke="#F9A03F" stroke-width="2.5" stroke-dasharray="6 6"/>
  <text x="1140" y="790" font-size="20" fill="#F9A03F" text-anchor="middle" font-weight="600">Day 175</text>

  <!-- D182 marker -->
  <line x1="1290" y1="800" x2="1290" y2="990" stroke="#F65B27" stroke-width="2.5"/>
  <text x="1290" y="790" font-size="20" fill="#F65B27" text-anchor="middle" font-weight="600">Day 182</text>

  <!-- rollover window box between leg ends -->
  <rect x="1144" y="818" width="118" height="146" rx="10" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="7 6"/>
  <line x1="1203" y1="964" x2="1203" y2="988" stroke="#FFFFFF" stroke-width="2"/>
  <text x="1203" y="1012" font-size="19" fill="#FFFFFF" text-anchor="middle" font-weight="600">rollover window, not to scale</text>
  <text x="1203" y="1038" font-size="18" fill="#C7C7CC" text-anchor="middle">950 Bitcoin blocks, followed by the 100-Bitcoin-block prepare phase</text>

  <text x="438" y="996" font-size="19" fill="#8E8E93" font-family="JetBrains Mono, Menlo, monospace">24 DISTRIBUTIONS, ONE PER 1,050 BITCOIN BLOCKS</text>

  <!-- callout cards -->
  <rect x="24" y="1072" width="486" height="222" rx="24" fill="#161618"/>
  <rect x="530" y="1072" width="486" height="222" rx="24" fill="#161618"/>
  <rect x="1036" y="1072" width="480" height="222" rx="24" fill="#161618"/>

  <text x="62" y="1130" font-size="24" font-weight="600" fill="#FFFFFF">Day 0</text>
  <text font-size="22" fill="#C7C7CC">
    <tspan x="62" y="1172">Both legs locked by this height.</tspan>
    <tspan x="62" y="1204">Registration lands at least 100 Bitcoin</tspan>
    <tspan x="62" y="1236">blocks early: the prepare phase</tspan>
    <tspan x="62" y="1268">before Day 0 rejects it.</tspan>
  </text>

  <text x="568" y="1130" font-size="24" font-weight="600" fill="#F9A03F">Day 175</text>
  <text font-size="22" fill="#C7C7CC">
    <tspan x="568" y="1172">The L1 timelock's minimum</tspan>
    <tspan x="568" y="1204">unlock height: 1,050 Bitcoin</tspan>
    <tspan x="568" y="1236">blocks before the L2 end,</tspan>
    <tspan x="568" y="1268">about seven days.</tspan>
  </text>

  <text x="1074" y="1130" font-size="24" font-weight="600" fill="#F65B27">Day 182</text>
  <text font-size="22" fill="#C7C7CC">
    <tspan x="1074" y="1172">The bonding period ends on</tspan>
    <tspan x="1074" y="1204">L2. STX unlocks at the next</tspan>
    <tspan x="1074" y="1236">cycle boundary.</tspan>
  </text>
</svg>
