name: Sync sBTC signers peg-wallet address

# Reads the current aggregate public key from sbtc-registry on mainnet,
# derives the signers' Bitcoin taproot address, and opens a PR when docs drift.
#
# Runs daily at midnight UTC or on manual dispatch.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"  # Daily at midnight UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd35ae259fecca05c1517537d454 # v4.2.0
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: scripts/pnpm-lock.yaml

      - name: Install script dependencies
        working-directory: scripts
        run: pnpm install --frozen-lockfile

      - name: Sync sBTC signers address in docs
        working-directory: scripts
        run: pnpm run sync-sbtc-signer-address

      - name: Detect drift
        id: diff
        run: |
          if git diff --quiet -- \
            docs/build/more-guides/sbtc/bridging-bitcoin/btc-to-sbtc.md \
            docs/learn/sbtc/README.md \
            docs/learn/sbtc/sbtc-signers.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore: update the sbtc signers' address"
          title: "chore: update the sbtc signers' address"
          body: |
            Updated the sBTC signers' peg-wallet Bitcoin address in documentation
            to match the current `current-aggregate-pubkey` value in
            `sbtc-registry` on Stacks mainnet.

            Generated by `.github/workflows/sync-sbtc-signer-address.yml`.
          branch: chore/sync-sbtc-signer-address
          delete-branch: true
          sign-commits: true
          add-paths: |
            docs/build/more-guides/sbtc/bridging-bitcoin/btc-to-sbtc.md
            docs/learn/sbtc/README.md
            docs/learn/sbtc/sbtc-signers.md
